services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aitrader
      POSTGRES_PASSWORD: aitrader
      POSTGRES_DB: aitrader
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aitrader"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata: {}
